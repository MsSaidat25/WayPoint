{% extends "base.html" %}
{% block title %}Report a trail{% endblock %}
{% block content %}
    <h1>Report a trail</h1>
    <form method="post" action="{% url 'report' %}">
        {% csrf_token %}
        <p><label>Name: <input type="text" name="name"></label></p>
        <p><label>Email: <input type="email" name="email"></label></p>
        <p><label>Trail: <input type="text" name="trail"></label></p>
        <p><label>Note: <textarea name="note"></textarea></label></p>
        <p><button type="submit">Submit report</button></p>
    </form>
{% endblock %}
